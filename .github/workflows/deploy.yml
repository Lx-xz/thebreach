name: Publicar no GitHub Pages

# O site é estático: o conteúdo do acervo é lido no build, não em runtime.
# Por isso ele precisa ser reconstruído quando o acervo muda — daí o
# repository_dispatch disparado pelo repositório breach e o horário diário
# como rede de segurança.
on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:
  repository_dispatch:
    types: [acervo-atualizado]
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Construir
    runs-on: ubuntu-latest
    steps:
      - name: Obter o código do site
        uses: actions/checkout@v4

      - name: Conferir o acesso ao acervo
        env:
          BREACH_TOKEN: ${{ secrets.BREACH_TOKEN }}
        run: |
          if [ -z "$BREACH_TOKEN" ]; then
            echo "::error::O segredo BREACH_TOKEN não está configurado neste repositório."
            echo "O acervo Lx-xz/breach é privado e precisa de um token para ser lido."
            echo "Crie um token de escopo fino com 'Contents: Read' em Lx-xz/breach e"
            echo "guarde-o em Settings › Secrets and variables › Actions como BREACH_TOKEN."
            exit 1
          fi
          echo "Segredo presente."

      - name: Preparar o Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar tipos
        run: npm run typecheck

      - name: Construir o site a partir do acervo
        env:
          BREACH_TOKEN: ${{ secrets.BREACH_TOKEN }}
          BREACH_OWNER: Lx-xz
          BREACH_REPO: breach
          BREACH_REF: main
          # Em project pages a URL é /<repo>/. Com domínio próprio, defina a
          # variável SITE_BASE_PATH como vazia em Settings › Variables.
          NEXT_PUBLIC_BASE_PATH: ${{ vars.SITE_BASE_PATH != '' && vars.SITE_BASE_PATH || '/thebreach' }}
        run: npm run build

      - name: Enviar o artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    name: Publicar
    needs: build
    # O ambiente github-pages só aceita deploy da branch padrão. Em branch de
    # trabalho o build continua rodando — é ele que prova que a mudança está
    # de pé — mas a publicação é pulada em vez de falhar.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no Pages
        id: deployment
        uses: actions/deploy-pages@v4
