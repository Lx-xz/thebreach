<!--
  Fonte do `public/apple-touch-icon.png` — o ícone que o iPhone usa ao guardar
  o site na tela inicial. Fica versionada aqui para o desenho ser rastreável: a
  marca é o mesmo losango partido do `Sigil` e do `favicon.svg`, e mudar um sem
  os outros passaria despercebido.

  Três coisas o iOS impõe, e nenhuma é opcional:
    · PNG. Ele não lê SVG neste `rel`.
    · Sem transparência. O que for transparente vira preto.
    · Sem cantos arredondados nossos. Ele aplica a máscara dele por cima, e o
      nosso arredondamento apareceria como sobra nas quinas.

  O losango ocupa 66% da altura da tela. Mais que isso e ele encosta na máscara
  do iOS; menos e a marca se perde no meio do papel. E o que está centrado é o
  desenho, não a caixa: na grade de 24 do Sigil o losango vai de 3,5 a 20,5 na
  horizontal e de 2,5 a 21,5 na vertical, então centrar pela caixa o deixaria
  fora do meio.

  Para reexportar em 180×180, com qualquer rasterizador que leia SVG:
    rsvg-convert -w 180 -h 180 scripts/icone-iphone.svg -o public/apple-touch-icon.png
-->
<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <rect width="180" height="180" fill="#f8f2e9"/>
  <g transform="translate(14.97 14.97) scale(6.2526)"
     fill="none" stroke="#8b7d5e" stroke-width="1.2"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5 20.5 12 12 21.5 3.5 12z"/>
    <path d="M12 2.5 9.4 12l2.6 9.5" opacity=".55"/>
    <path d="M12 2.5 14.6 12 12 21.5" opacity=".55"/>
  </g>
</svg>
